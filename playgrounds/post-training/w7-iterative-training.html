<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground 7 — Iterative Training Dynamics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fafaf8; color: #1a1a1a; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.65; }
  .card { background: #fff; border: 1px solid #e8e5de; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .hdr  { background: #f5f3ef; border-bottom: 1px solid #e8e5de; padding: 10px 18px; display: flex; align-items: center; gap: 10px; }
  .dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .ttl  { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6b6862; font-weight: 500; }
  .body { padding: 22px; }
  .desc { color: #6b6862; font-size: 13px; margin-bottom: 14px; line-height: 1.6; }
  .ctrl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .btn  { background: #fff; border: 1px solid #d4d0c8; color: #6b6862; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-weight: 500; transition: all .15s; }
  .btn:hover  { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
  .btn.run    { border-color: #2563eb; color: #2563eb; }
  .btn.run:hover { background: #2563eb; color: #fff; }
  .btn:disabled { opacity: .35; cursor: not-allowed; background: #f5f3ef; }
  .round-lbl { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #9c9890; font-weight: 500; }
  canvas { display: block; width: 100%; background: #f5f3ef; border-radius: 6px; border: 1px solid #e8e5de; margin-bottom: 12px; }
  .comm { background: #f5f3ef; border: 1px solid #e8e5de; border-radius: 5px; padding: 12px 15px; font-size: 13px; color: #6b6862; line-height: 1.65; min-height: 50px; }
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span class="ttl">Playground 7 — Iterative Training Dynamics</span>
  </div>
  <div class="body">
    <p class="desc">Step through five rounds of post-training. Each round targets a different capability axis. Notice diminishing returns as training matures — a consistent real-world pattern.</p>
    <div class="ctrl">
      <button class="btn run" id="run-btn">▶ Run Next Round</button>
      <button class="btn" id="reset-btn">↺ Reset</button>
      <span class="round-lbl" id="round-lbl">Round 0 / 5</span>
    </div>
    <canvas id="chart" height="200"></canvas>
    <div class="comm" id="comm"></div>
  </div>
</div>
<script>
  var round = 0, max = 5;
  var D = { helpfulness: [2.1], safety: [1.8], honesty: [2.4], factuality: [1.9] };
  var notes = [
    'Starting from the SFT baseline — assistant-shaped but unrefined on all dimensions.',
    'Round 1: Helpfulness-focused preferences applied. All metrics lift as the model starts responding more usefully.',
    'Round 2: Safety-specific preference pairs (jailbreak attempts, harmful requests). Safety improves substantially.',
    'Round 3: Honesty-focused critique pairs targeting sycophancy and overconfidence. The model now expresses uncertainty better.',
    'Round 4: Factuality pass using AI-verified preference data at scale. The gap between what the model says and what is true narrows.',
    'Round 5: Mixed-signal pass. Improvement rate slows — diminishing returns are normal as the model approaches its ceiling.'
  ];
  /* Warm editorial palette for the chart lines */
  var cols  = { helpfulness: '#2563eb', safety: '#059669', honesty: '#7c3aed', factuality: '#d97706' };
  var lbls  = { helpfulness: 'Helpfulness', safety: 'Safety', honesty: 'Honesty', factuality: 'Factuality' };
  var canvas = document.getElementById('chart'), ctx = canvas.getContext('2d');

  function draw() {
    var w = canvas.offsetWidth || 500, h = 200, dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var pL = 44, pR = 14, pT = 16, pB = 28, cw = w - pL - pR, ch = h - pT - pB, mn = 1.5, mx = 5;

    /* grid lines */
    ctx.strokeStyle = '#e8e5de'; ctx.lineWidth = 1;
    [1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5].forEach(function(v) {
      var y = pT + ch - ((v - mn) / (mx - mn)) * ch;
      ctx.beginPath(); ctx.moveTo(pL, y); ctx.lineTo(pL + cw, y); ctx.stroke();
      ctx.fillStyle = '#9c9890'; ctx.font = "11px 'JetBrains Mono', monospace";
      ctx.textAlign = 'right'; ctx.fillText(v.toFixed(1), pL - 6, y + 4);
    });

    /* x labels */
    ctx.textAlign = 'center';
    for (var r = 0; r <= max; r++) {
      ctx.fillStyle = '#9c9890'; ctx.font = "11px 'JetBrains Mono', monospace";
      ctx.fillText('R' + r, pL + (r / max) * cw, h - 6);
    }

    /* lines + dots */
    Object.keys(D).forEach(function(k) {
      var vals = D[k];
      ctx.beginPath();
      vals.forEach(function(v, i) {
        var x = pL + (i / max) * cw, y = pT + ch - ((v - mn) / (mx - mn)) * ch;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.strokeStyle = cols[k]; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
      vals.forEach(function(v, i) {
        var x = pL + (i / max) * cw, y = pT + ch - ((v - mn) / (mx - mn)) * ch;
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.strokeStyle = cols[k]; ctx.lineWidth = 2; ctx.stroke();
      });
    });

    /* legend */
    var lx = pL;
    Object.keys(cols).forEach(function(k) {
      ctx.strokeStyle = cols[k]; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(lx, pT + 6); ctx.lineTo(lx + 14, pT + 6); ctx.stroke();
      ctx.fillStyle = '#6b6862'; ctx.font = "11px 'JetBrains Mono', monospace";
      ctx.textAlign = 'left'; ctx.fillText(lbls[k], lx + 18, pT + 10);
      lx += 100;
    });
  }

  function refresh() { draw(); document.getElementById('comm').textContent = notes[round]; notify(); }

  document.getElementById('run-btn').addEventListener('click', function() {
    if (round >= max) return; round++;
    document.getElementById('round-lbl').textContent = 'Round ' + round + ' / ' + max;
    if (round === max) this.disabled = true;
    var dec = 1 / (1 + round * .5);
    function bump(arr, sc) { arr.push(Math.min(5, arr[round - 1] + sc * dec * (.9 + Math.random() * .2))); }
    bump(D.helpfulness, round === 1 ? .9 : .3);
    bump(D.safety,      round === 2 ? 1.1 : .25);
    bump(D.honesty,     round === 3 ? .8 : .2);
    bump(D.factuality,  round === 4 ? 1.0 : .3);
    refresh();
  });

  document.getElementById('reset-btn').addEventListener('click', function() {
    round = 0; D = { helpfulness: [2.1], safety: [1.8], honesty: [2.4], factuality: [1.9] };
    document.getElementById('round-lbl').textContent = 'Round 0 / 5';
    document.getElementById('run-btn').disabled = false;
    refresh();
  });

  function notify() { window.parent.postMessage({ iframeId: 'rlhf-w7', height: document.body.scrollHeight }, '*'); }
  refresh();
  window.addEventListener('load', notify);
  window.addEventListener('resize', function() { draw(); notify(); });
</script>
</body>
</html>
