<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Full Post-Training Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fafaf8; color: #1a1a1a; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
  .card { background: #fff; border: 1px solid #e8e5de; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .hdr  { background: #f5f3ef; border-bottom: 1px solid #e8e5de; padding: 10px 18px; display: flex; align-items: center; gap: 10px; }
  .dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .ttl  { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #6b6862; font-weight: 500; }
  .body { padding: 22px; }
  svg   { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="hdr">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <span class="ttl">The Full Post-Training Stack</span>
  </div>
  <div class="body">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr"   markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#9c9890"/></marker>
    <marker id="arr-b" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2563eb"/></marker>
    <marker id="arr-p" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#7c3aed"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#059669"/></marker>
    <marker id="arr-o" markerWidth="8" markerHeight="6" refX="6" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#d97706"/></marker>
  </defs>

  <!-- ── Row 1: main pipeline ── -->
  <rect x="10"  y="42" width="152" height="68" rx="6" fill="#f5f3ef" stroke="#e0dcd4" stroke-width="1.5"/>
  <text x="86"  y="64" text-anchor="middle" fill="#9c9890" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing=".8">PRE-TRAINING</text>
  <text x="86"  y="84" text-anchor="middle" fill="#1a1a1a" font-family="'Inter',sans-serif" font-size="13" font-weight="600">Base Model</text>

  <line x1="162" y1="76" x2="198" y2="76" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="200" y="42" width="152" height="68" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="276" y="64" text-anchor="middle" fill="#2563eb" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing=".8">SFT</text>
  <text x="276" y="84" text-anchor="middle" fill="#1a1a1a" font-family="'Inter',sans-serif" font-size="13" font-weight="600">SFT Model</text>

  <line x1="352" y1="76" x2="388" y2="76" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="390" y="42" width="168" height="68" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="474" y="61" text-anchor="middle" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing=".8">REWARD MODEL</text>
  <text x="474" y="73" text-anchor="middle" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing=".8">TRAINING</text>
  <text x="474" y="89" text-anchor="middle" fill="#1a1a1a" font-family="'Inter',sans-serif" font-size="11.5" font-weight="500">Human Preferences</text>

  <line x1="558" y1="76" x2="594" y2="76" stroke="#d4d0c8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="596" y="42" width="152" height="68" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="672" y="64" text-anchor="middle" fill="#059669" font-family="'JetBrains Mono',monospace" font-size="8" letter-spacing=".8">RL (PPO)</text>
  <text x="672" y="84" text-anchor="middle" fill="#1a1a1a" font-family="'Inter',sans-serif" font-size="13" font-weight="600">Aligned Model</text>

  <!-- ── DPO shortcut arc (purple dashed): SFT → Aligned Model ── -->
  <path d="M352 76 C374 158 574 158 596 76" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arr-p)"/>
  <rect x="436" y="149" width="76" height="22" rx="4" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1"/>
  <text x="474" y="164" text-anchor="middle" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="10.5" font-weight="600">DPO</text>

  <!-- ── Iterative loop (blue dashed): Aligned → SFT ── -->
  <path d="M672 110 L672 194 L276 194 L276 110" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arr-b)"/>
  <text x="474" y="190" text-anchor="middle" fill="#2563eb" font-family="'JetBrains Mono',monospace" font-size="8.5">iterative rounds</text>

  <!-- ── Row 2: supporting concepts (y=240) ── -->

  <!-- Human Annotators -->
  <rect x="10" y="240" width="165" height="62" rx="6" fill="#fafaf8" stroke="#2563eb" stroke-width="1.5"/>
  <text x="92"  y="261" text-anchor="middle" fill="#2563eb" font-family="'JetBrains Mono',monospace" font-size="7.5" letter-spacing=".8">HUMAN ANNOTATORS</text>
  <text x="92"  y="278" text-anchor="middle" fill="#6b6862" font-family="'Inter',sans-serif" font-size="11">Preference labels</text>
  <!-- L-path: up from box top, right to RM center, up to RM box bottom -->
  <path d="M92 240 L92 218 L474 218 L474 110" stroke="#2563eb" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arr-b)"/>

  <!-- Constitutional AI / RLAIF -->
  <rect x="240" y="240" width="295" height="62" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="387" y="261" text-anchor="middle" fill="#7c3aed" font-family="'JetBrains Mono',monospace" font-size="7.5" letter-spacing=".8">CONSTITUTIONAL AI / RLAIF</text>
  <text x="387" y="278" text-anchor="middle" fill="#6b6862" font-family="'Inter',sans-serif" font-size="11">AI-generated feedback at scale</text>
  <!-- Connects up to the iterative rounds path -->
  <line x1="387" y1="240" x2="387" y2="194" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-p)"/>

  <!-- KL Divergence Penalty -->
  <rect x="598" y="240" width="168" height="74" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="682" y="260" text-anchor="middle" fill="#d97706" font-family="'JetBrains Mono',monospace" font-size="7.5" letter-spacing=".8">KL DIVERGENCE PENALTY</text>
  <text x="682" y="278" text-anchor="middle" fill="#6b6862" font-family="'Inter',sans-serif" font-size="11">Keeps policy close to SFT</text>
  <text x="682" y="294" text-anchor="middle" fill="#6b6862" font-family="'Inter',sans-serif" font-size="11">Prevents reward hacking</text>
  <!-- Straight up to Aligned Model box bottom -->
  <line x1="682" y1="240" x2="682" y2="110" stroke="#d97706" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr-o)"/>

  <!-- ── Legend ── -->
  <line x1="14" y1="372" x2="48" y2="372" stroke="#d4d0c8" stroke-width="1.5"/>
  <text x="56" y="376" fill="#9c9890" font-family="'JetBrains Mono',monospace" font-size="8.5">main training flow</text>

  <line x1="14" y1="392" x2="48" y2="392" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="56" y="396" fill="#9c9890" font-family="'JetBrains Mono',monospace" font-size="8.5">DPO shortcut (bypasses reward model + RL)</text>

  <line x1="14" y1="412" x2="48" y2="412" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="56" y="416" fill="#9c9890" font-family="'JetBrains Mono',monospace" font-size="8.5">iterative feedback loops</text>

  <line x1="14" y1="432" x2="48" y2="432" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="56" y="436" fill="#9c9890" font-family="'JetBrains Mono',monospace" font-size="8.5">AI feedback replaces human labels</text>

  <line x1="14" y1="452" x2="48" y2="452" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="56" y="456" fill="#9c9890" font-family="'JetBrains Mono',monospace" font-size="8.5">KL divergence constraint</text>
</svg>
  </div>
</div>
<script>
  function notify() { window.parent.postMessage({ iframeId: 'rlhf-w8', height: document.body.scrollHeight }, '*'); }
  window.addEventListener('load', notify);
  window.addEventListener('resize', notify);
</script>
</body>
</html>
